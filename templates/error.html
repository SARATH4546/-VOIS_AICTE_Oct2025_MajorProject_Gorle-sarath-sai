{% extends "base.html" %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="card">
                <div class="card-body">
                    <i class="fas fa-exclamation-triangle fa-5x text-warning mb-4"></i>
                    <h2 class="text-danger">Error {{ error_code if error_code else 'Occurred' }}</h2>
                    <p class="text-muted">{{ error_message if error_message else 'Something went wrong' }}</p>
                    <div class="mt-4">
                        <a href="{{ url_for('index') }}" class="btn btn-netflix">
                            <i class="fas fa-home"></i> Go Home
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
